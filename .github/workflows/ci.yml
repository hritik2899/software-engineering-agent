name: CI

on:
  push:
    branches: [main, hardening-audit]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q src tests scripts migrations

      - name: Lint
        run: ruff check src tests scripts migrations

      - name: Unit and integration tests
        run: pytest -q

      - name: Full local control-plane smoke test
        run: python scripts/smoke_test.py

      - name: Validate fresh Alembic migration
        env:
          MINION_DATABASE_URL: sqlite+aiosqlite:///./migration-ci.db
        run: alembic upgrade head
