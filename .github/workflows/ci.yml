name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src
      - run: ruff check src tests
      - run: MINION_DATABASE_URL=sqlite+aiosqlite:///./ci_migration.db alembic upgrade head\n      - run: python -c "from minion.api import app; assert app.title"\n      - run: pytest -q
