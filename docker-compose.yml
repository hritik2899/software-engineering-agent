# Minion production-style local infrastructure.
# PostgreSQL is authoritative durable state; Redis provides Streams work delivery
# and Pub/Sub live fan-out. Agent execution itself remains in separately managed
# Docker warm sandboxes, not inside these service containers.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: minion
      POSTGRES_PASSWORD: minion
      POSTGRES_DB: minion
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minion"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  sandbox-image:
    image: minion-sandbox:latest
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    command: ["true"]
